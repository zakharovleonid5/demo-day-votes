log_format demo_day '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80 default_server;
    server_name 194-87-103-89.sslip.io;
    server_tokens off;
    access_log /var/log/nginx/demo-day-access.log demo_day;
    location /.well-known/acme-challenge/ { root /var/www/demo-day-acme; }
    location / { return 308 https://194-87-103-89.sslip.io$request_uri; }
}
server {
    listen 443 ssl;
    server_name 194-87-103-89.sslip.io;
    ssl_certificate /etc/letsencrypt/live/194-87-103-89.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/194-87-103-89.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 128k;
    access_log /var/log/nginx/demo-day-access.log demo_day;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
